services:
  postgres:
    # pgvector 확장 프리설치된 PG15 (RAG 챗봇용). 데이터 디렉토리는 PG15 그대로 호환.
    image: pgvector/pgvector:pg15
    container_name: speechpt-postgres
    restart: always
    environment:
      POSTGRES_USER: SPusers
      POSTGRES_PASSWORD: 1125
      POSTGRES_DB: SpeechPT
    ports:
      - "5433:5432"
    volumes:
      - speechpt_pgdata:/var/lib/postgresql/data

volumes:
  speechpt_pgdata: